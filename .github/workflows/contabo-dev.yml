# Fork-only pipeline: builds the regular (multi-container) image for the
# Contabo dev cluster. Argo CD Image Updater picks up the newest
# dev-<sha12>-<run_id>-<attempt> tag and rolls it out to open-notebook-dev.
# Manifests: devops-contabo/cluster-ih1 · Argo CD config: devops-contabo/gitops-ih1
name: contabo-dev

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contabo-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/tranvien98/open-notebook

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: tag
        name: Create a unique tag for this run
        shell: bash
        run: |
          TAG="dev-${GITHUB_SHA::12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build locally on runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image before publishing
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
          format: table
          severity: CRITICAL
          ignore-unfixed: 'true'
          exit-code: '1'

      - name: Push and print image reference
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          docker push "$IMAGE:$TAG"
          printf 'Image: `%s:%s`\n' "$IMAGE" "$TAG" >> "$GITHUB_STEP_SUMMARY"
